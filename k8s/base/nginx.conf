# FileGrid gateway: the ONLY service that publishes host ports.
# TLS termination, SPA, and /api/ proxy to the (scalable) backend.

# Kubernetes copy of infrastructure/nginx/default.conf (slice J). Differences: cluster DNS
# resolver, and /api/ goes straight to the backend Service (kube-proxy spreads connections
# over the pods; toxiproxy is a compose-only demo tool). Keep the rest in sync with the
# compose file when it changes.
resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

# Password guessing: at most 20 login attempts per minute per client IP (burst 10), then 429.
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Security headers (repeated in locations that set their own add_header)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        set $backend http://backend.filegrid.svc.cluster.local:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        client_max_body_size 4k;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        set $backend http://backend.filegrid.svc.cluster.local:8000;
        proxy_pass $backend;               # URI passed through unchanged (/api/v1/...)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;

        # Stream uploads/downloads: never buffer a whole file in nginx
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # /metrics and /health are internal-only (Prometheus scrapes backend directly)
    location = /metrics { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
