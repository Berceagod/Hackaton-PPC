# FileGrid gateway: the ONLY service that publishes host ports.
# TLS termination, SPA, and /api/ proxy to the (scalable) backend.

# Kubernetes copy of infrastructure/nginx/default.conf (slice J, regenerated after slice H).
# Differences: cluster DNS resolver; /api/ goes straight to the backend Service (kube-proxy
# spreads connections over the pods; toxiproxy is a compose-only demo tool); /grafana/ points
# at a grafana Service that does not exist in the cluster yet (observability runs on compose:
# 502 here until it is deployed). Keep everything else in sync with the compose file.
resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

# Password guessing: at most 20 login attempts per minute per client IP (burst 10), then 429.
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

# ---- slice H (observability) ----
# WebSocket upgrade for Grafana Live.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# JSON access log. `trace_id` is the id the BACKEND assigned (or echoed) for the request, so
# the gateway hop appears in Loki under the same trace id as everything behind it. `$uri` has
# no query string: search terms typed by users never reach the log.
log_format fg_json escape=json
    '{"ts":"$time_iso8601","service":"nginx","level":"info","msg":"request",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_s":$request_time,"bytes_sent":$body_bytes_sent,'
    '"remote":"$remote_addr","trace_id":"$upstream_http_x_trace_id"}';

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Security headers (repeated in locations that set their own add_header)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;
    access_log /dev/stdout fg_json;   # slice H: structured, with the trace id

    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        set $backend http://backend.filegrid.svc.cluster.local:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        client_max_body_size 4k;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        set $backend http://backend.filegrid.svc.cluster.local:8000;
        proxy_pass $backend;               # URI passed through unchanged (/api/v1/...)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;

        # Stream uploads/downloads: never buffer a whole file in nginx
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # slice H: Grafana (dashboards, logs) behind the same TLS gateway; it has its own login
    # (admin password generated by start.sh as GRAFANA_ADMIN_PASSWORD). Prometheus, Loki and
    # Alertmanager are NOT exposed: Grafana reads them over the internal network.
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        set $grafana http://grafana.filegrid.svc.cluster.local:3000;   # not deployed in k8s yet
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 10m;
    }

    # /metrics and /health are internal-only (Prometheus scrapes backend directly)
    location = /metrics { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
