# FTP storage backend (pure-ftpd, same image and settings as docker-compose).
# Passive mode: the server tells clients to connect back to PUBLICHOST "ftp" (this
# Service's ClusterIP) on a port from FTP_PASSIVE_PORTS, so every passive port is declared
# on the Service. 40 ports = 40 concurrent transfers.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ftp
  labels: {app: ftp, tier: storage}
spec:
  serviceName: ftp
  replicas: 1
  selector:
    matchLabels: {app: ftp}
  template:
    metadata:
      labels: {app: ftp, tier: storage}
    spec:
      containers:
        - name: ftp
          image: stilliard/pure-ftpd:latest
          env:
            - {name: PUBLICHOST, value: ftp}
            - {name: FTP_USER_HOME, value: /home/filegrid}
            - {name: FTP_MAX_CLIENTS, value: "40"}
            - {name: FTP_MAX_CONNECTIONS, value: "40"}
            - {name: FTP_PASSIVE_PORTS, value: "30000:30039"}
            - name: FTP_USER_NAME
              valueFrom: {secretKeyRef: {name: filegrid-storage, key: FTP_USER}}
            - name: FTP_USER_PASS
              valueFrom: {secretKeyRef: {name: filegrid-storage, key: FTP_PASSWORD}}
          ports:
            - {containerPort: 21, name: ftp}
          readinessProbe:
            tcpSocket: {port: 21}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
          volumeMounts: [{name: data, mountPath: /home/filegrid}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: ftp
  labels: {app: ftp}
spec:
  selector: {app: ftp}
  ports:
    - {name: ftp, port: 21, targetPort: 21}
    - {name: pasv-0, port: 30000, targetPort: 30000}
    - {name: pasv-1, port: 30001, targetPort: 30001}
    - {name: pasv-2, port: 30002, targetPort: 30002}
    - {name: pasv-3, port: 30003, targetPort: 30003}
