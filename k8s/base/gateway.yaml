# The gateway (nginx: TLS, the React UI, /api/ proxy) is the only way in, as in compose.
# It is the only Service reachable from outside the cluster (NodePort 30443 ->
# https://localhost:8443 through kind). Same image as compose; its config comes from
# k8s/base/nginx.conf (Kubernetes DNS, straight to the backend Service: no toxiproxy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels: {app: nginx, tier: edge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx, tier: edge}
    spec:
      containers:
        - name: nginx
          image: filegrid/nginx:k8s
          imagePullPolicy: Never
          ports:
            - {containerPort: 443, name: https}
            - {containerPort: 80, name: http}
          readinessProbe:
            httpGet: {path: /healthz, port: 443, scheme: HTTPS}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/filegrid.conf
              subPath: filegrid.conf
            - name: tls                       # cert + key from a Secret (k8s/up.sh)
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: conf
          configMap: {name: filegrid-gateway-conf}
        - name: tls
          secret: {secretName: filegrid-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels: {app: nginx}
spec:
  type: NodePort
  selector: {app: nginx}
  ports:
    - {name: https, port: 443, targetPort: 443, nodePort: 30443}
    - {name: http, port: 80, targetPort: 80}
