# X1 on Kubernetes: storages are reachable only by the backend; the backend only through
# the gateway; the gateway is the single entry point. Everything else is denied.
# (When slice H adds Prometheus, it needs its own allow rule to scrape backend:8000.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-anywhere
spec:
  podSelector:
    matchLabels: {app: nginx}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 443, protocol: TCP}
        - {port: 80, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-gateway
spec:
  podSelector:
    matchLabels: {app: backend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: nginx}
      ports:
        - {port: 8000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storages-from-backend
spec:
  podSelector:
    matchLabels: {tier: storage}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: backend}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 9000, protocol: TCP}
        - {port: 21, protocol: TCP}
        - {port: 30000, endPort: 30039, protocol: TCP}   # FTP passive data connections
