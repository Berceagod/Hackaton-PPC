# Local Kubernetes cluster for FileGrid (kind = Kubernetes in Docker). Slice J, ADR-0026.
# The gateway's NodePort 30443 is published on https://localhost:8443 (not 443, so the
# Docker Compose stack and the cluster can run on the same machine).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: filegrid
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
