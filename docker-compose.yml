# FileGrid — slice A stack. Start with ./start.sh (generates .env secrets first).
# Only nginx publishes host ports; every storage lives on the internal network.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://filegrid:${POSTGRES_META_PASSWORD:?run ./start.sh}@postgres-meta:5432/filegrid
  UVICORN_WORKERS: ${UVICORN_WORKERS:-4}   # backend processes per container (slice G)
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?run ./start.sh}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?run ./start.sh}
  S3_BUCKET: filegrid
  BLOB_DATABASE_URL: postgresql://filegrid:${POSTGRES_BLOB_PASSWORD:?run ./start.sh}@postgres-blob:5432/filegrid_blob
  FTP_HOST: ftp
  FTP_PORT: "21"
  FTP_USER: ${FTP_USER:?run ./start.sh}
  FTP_PASSWORD: ${FTP_PASSWORD:?run ./start.sh}
  JWT_SECRET: ${JWT_SECRET:?run ./start.sh}
  SIMULATOR_TOKEN: ${SIMULATOR_TOKEN:?run ./start.sh}
  DISPECER_PASSWORD: ${DISPECER_PASSWORD:?run ./start.sh}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run ./start.sh}
  FILEGRID_MASTER_KEY: ${FILEGRID_MASTER_KEY:?run ./start.sh}
  POLICIES_PATH: /app/policies.yaml

  # ---- slice H (observability) backend env: add directly below this line ----
  # Several workers per container: every worker writes its metrics into this directory and
  # /metrics aggregates them (prometheus_client multiprocess mode, ADR-0014).
  PROMETHEUS_MULTIPROC_DIR: /tmp/prom_multiproc
  PROMETHEUS_SAMPLE_SECONDS: ${PROMETHEUS_SAMPLE_SECONDS:-10}
  PROMETHEUS_UPLOAD_STALL_SECONDS: ${PROMETHEUS_UPLOAD_STALL_SECONDS:-300}

  # ---- slice I (analytics) backend env: add directly below this line ----
  PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
  ANALYTICS_RANGE: ${ANALYTICS_RANGE:-5m}
  ANALYTICS_TIMEOUT_SECONDS: ${ANALYTICS_TIMEOUT_SECONDS:-2}

  # ---- slice J (scale-out) backend env: add directly below this line ----

services:
  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
      args:
        VITE_USE_MOCK: "false"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
    volumes:
      # key pair survives container re-creation (rebuild, up --build): a new cert on every
      # restart broke the simulator's pinned CA and it dropped readings (ADR-0003)
      - gateway-certs:/etc/nginx/certs
      - gateway-ca:/etc/nginx/ca      # public cert only (see 40-gen-cert.sh)
    networks: [edge, internal]
    restart: unless-stopped

  simulator:            # teammates' smart-meter simulator; talks to FileGrid like a real meter
    build: ./simulator
    environment:
      API_URL: https://nginx/api/v1/ingest
      API_TOKEN: ${SIMULATOR_TOKEN:?run ./start.sh}
      VERIFY_TLS: /certs/tls.crt      # verify the gateway certificate (not "false")
      INGEST_MODE: multipart
      BASE_RATE: ${SIM_BASE_RATE:-10}
      STORM_MULTIPLIER: ${SIM_STORM_MULTIPLIER:-10}
      METER_COUNT: ${SIM_METER_COUNT:-1000}
      DUPLICATE_RATIO: ${SIM_DUPLICATE_RATIO:-0.05}
      ANOMALY_RATIO: ${SIM_ANOMALY_RATIO:-0.02}
      START_MODE: ${SIM_START_MODE:-normal}
    volumes:
      - gateway-ca:/certs:ro
    depends_on:
      nginx:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  # Network-fault injector between the gateway and the backend (slice G). With no toxics it
  # passes traffic through unchanged; scripts/chaos/network-bad.sh adds latency, a bandwidth
  # cap and dropped connections to show transfers finish or resume (PDF §4 Reziliență).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infrastructure/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  backend:
    build: ./backend
    environment: *backend-env
    # Hard cap: a 1 GB+ upload must pass through a 512 MB container (streaming, slice E)
    mem_limit: 512m
    volumes:
      - ./policies.yaml:/app/policies.yaml:ro
    depends_on:
      postgres-meta:
        condition: service_healthy
      minio:
        condition: service_healthy
      # started (not healthy): a down storage must never block the backend or other categories
      postgres-blob:
        condition: service_started
      ftp:
        condition: service_started
    networks: [internal]
    restart: unless-stopped

  postgres-meta:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filegrid
      POSTGRES_PASSWORD: ${POSTGRES_META_PASSWORD:?run ./start.sh}
      POSTGRES_DB: filegrid
    volumes:
      - pgmeta:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filegrid -d filegrid"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  minio:
    build: ./infrastructure/minio   # built from source: upstream no longer publishes images
    image: filegrid-minio:local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run ./start.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run ./start.sh}
    volumes:
      - miniodata:/data
    networks: [internal]
    restart: unless-stopped

  postgres-blob:        # DATABASE storage backend (separate instance from the metadata DB)
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filegrid
      POSTGRES_PASSWORD: ${POSTGRES_BLOB_PASSWORD:?run ./start.sh}
      POSTGRES_DB: filegrid_blob
    volumes:
      - pgblob:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filegrid -d filegrid_blob"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  ftp:                  # FTP storage backend (pure-ftpd), internal network only
    image: stilliard/pure-ftpd:latest
    environment:
      PUBLICHOST: ftp
      FTP_USER_NAME: ${FTP_USER:?run ./start.sh}
      FTP_USER_PASS: ${FTP_PASSWORD:?run ./start.sh}
      FTP_USER_HOME: /home/filegrid
      # The image defaults to 5 sessions, far too few for a storage backend. Each
      # backend instance holds at most FTP_MAX_CONCURRENCY (8) sessions, so 60 leaves
      # room for several replicas; one passive port is needed per transfer.
      FTP_MAX_CLIENTS: "60"
      FTP_MAX_CONNECTIONS: "60"
      FTP_PASSIVE_PORTS: "30000:30099"
    volumes:
      - ftpdata:/home/filegrid
    networks: [internal]
    restart: unless-stopped

  # ---- slice H (observability) services: add directly below this line ----
  # None of these publishes a host port: they are reached through the gateway (Grafana at
  # https://localhost/grafana/) or from inside the Docker network.

  prometheus:           # metrics store + alert rules; scrapes EVERY backend replica (DNS discovery)
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - alertmanager
    networks: [internal]
    restart: unless-stopped

  alertmanager:         # groups alerts and sends them to the webhook below
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      alert-webhook:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  alert-webhook:        # stands in for the team's channel: logs and keeps every alert (GET /alerts)
    build: ./infrastructure/alertmanager/webhook
    networks: [internal]
    restart: unless-stopped

  loki:                 # log store (48 h)
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    networks: [internal]
    restart: unless-stopped

  alloy:                # log collector: this project's container logs -> Loki
    image: grafana/alloy:v1.11.0
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOKI_COMPOSE_PROJECT: ${LOKI_COMPOSE_PROJECT:-hackaton-ppc}
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
    networks: [internal]
    restart: unless-stopped

  # Read-only Docker API for Alloy (container list + logs, GET only: no start/stop/exec).
  # It shares Alloy's network namespace and is bound to 127.0.0.1, so no other container can
  # reach the Docker API through it. It mounts the Docker socket, which is why it is isolated
  # like this; see ADR-0017 for the trade-off.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    network_mode: "service:alloy"
    entrypoint:
      - /bin/sh
      - -c
      - "sed 's/\\$${BIND_CONFIG}/127.0.0.1:2375/g' /usr/local/etc/haproxy/haproxy.cfg.template > /usr/local/etc/haproxy/haproxy.cfg && exec haproxy -W -db -f /usr/local/etc/haproxy/haproxy.cfg"
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  grafana:              # dashboards as code + log search; https://localhost/grafana/ (user: admin)
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run ./start.sh}
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/filegrid-ops.json
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks: [internal]
    restart: unless-stopped

  # ---- slice I (analytics) services: add directly below this line ----

  # ---- slice J (scale-out) services: add directly below this line ----
networks:
  edge: {}
  internal:
    internal: true   # no route to/from the host: storages are unreachable from outside

volumes:
  gateway-certs: {}   # nginx TLS key pair; only the nginx container mounts it
  gateway-ca: {}
  pgmeta: {}
  pgblob: {}
  miniodata: {}
  ftpdata: {}

  # ---- slice H (observability) volumes: add directly below this line ----
  promdata: {}
  lokidata: {}
  grafanadata: {}

  # ---- slice I (analytics) volumes: add directly below this line ----

  # ---- slice J (scale-out) volumes: add directly below this line ----
